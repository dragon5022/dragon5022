    .label { font-size: 13px; fill: #0b1230; }
    .label2 { font-size: 12.5px; fill: #46507a; }
    .value { font-size: 13px; font-weight: 600; fill: #0b1230; font-variant-numeric: tabular-nums; }
    .kpi { font-size: 26px; font-weight: 600; fill: #0b1230; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
  </style>
