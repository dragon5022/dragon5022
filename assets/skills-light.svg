  <title id="title">Skills: self-rated proficiency, 0 to 100</title>
  <desc id="desc">Languages: Java 21 92, Python 3.12 90, TypeScript / JavaScript 88, SQL 82, Kotlin / Swift 62. Java ecosystem: Spring Boot / Spring Cloud 90, Hibernate / JPA 85, Maven &amp; Gradle 85, JUnit 5 / Mockito / Testcontainers 88, Apache Kafka 75. Python ecosystem: FastAPI / Django 88, Pandas / NumPy 85, SQLAlchemy / Alembic 80, pytest / Hypothesis 86, asyncio / Celery 74. Web &amp; mobile: Next.js / React 90, Tailwind CSS / GSAP / Three.js 82, React Native / Flutter 78, Unity / Cocos (mobile games) 72, WordPress / headless CMS 70. AI &amp; infrastructure: LLM APIs (OpenAI, Anthropic, Gemini) 88, Vector search / semantic caching 80, Docker &amp; Kubernetes 80, PostgreSQL / Redis 84, AWS / Vercel / GitHub Actions 80.</desc>
